# OSV-Scanner ignore list
# Add entries below to acknowledge unfixable vulnerabilities with a mandatory expiry date.
# The CI workflow fails when any entry's ignoreUntil date is in the past.
#
# Example:
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31T00:00:00Z
# reason = "No upstream fix available; revisit before expiry."

[[IgnoredVulns]]
id = "GHSA-g7r4-m6w7-qqqr"
ignoreUntil = 2026-11-20T00:00:00Z
reason = "esbuild arbitrary file read affects its Windows dev server only, which tsup never starts. The whole 0.27.x line from 0.27.3 is affected and the fix ships in 0.28.1+, but tsup@8.5.1 (latest, rechecked 2026-09-24) still requires esbuild ^0.27.0. Revisit when tsup widens its esbuild range."
